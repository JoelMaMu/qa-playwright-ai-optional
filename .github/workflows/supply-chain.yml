# Supply chain.
#
# On 19 March 2026 a threat actor used incompletely rotated credentials to
# force-push 76 of 77 version tags in `aquasecurity/trivy-action` and all 7 tags in
# `aquasecurity/setup-trivy` to credential-stealing malware (CVE-2026-33634,
# CVSS v4 9.4). A repository pinning `@0.34.2` received the malicious code without
# changing anything on its side.
#
# The operational lesson fits in one sentence: a tag is mutable.

name: supply chain

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # A dependency healthy today is not healthy tomorrow. This must run even when
    # nobody pushes.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Known vulnerabilities
        run: npm audit --audit-level=high

      # SBOM produced by npm itself. Adding a third-party action to inventory
      # dependencies would enlarge the very surface we are measuring.
      - name: SBOM (CycloneDX)
        run: npm sbom --sbom-format cyclonedx --omit dev > sbom.cdx.json

      - name: Publish SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 30

  pinning:
    name: everything is pinned
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Actions are pinned to a commit SHA
        run: |
          set -euo pipefail
          unpinned=$(grep -rhoE '^\s*(-\s+)?uses:\s*\S+' .github/workflows/ \
            | grep -vE 'uses:\s*\./' \
            | grep -vE '@[0-9a-f]{40}$' || true)

          if [ -n "$unpinned" ]; then
            echo "FAILED: actions not pinned to a commit SHA:"
            echo "$unpinned"
            exit 1
          fi
          echo "OK: every action is pinned to a commit SHA."

      - name: The SUT image is pinned by digest
        run: |
          set -euo pipefail
          if ! grep -qE 'image:.*@sha256:[0-9a-f]{64}' sut/docker/compose.yaml; then
            echo "FAILED: the SUT image is not pinned by digest."
            exit 1
          fi
          echo "OK: SUT image pinned by digest."

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: AGPL-3.0, GPL-3.0
