# Hardened Playwright MCP server. DEVELOPER WORKSTATION ONLY.
#
# ADR-0002: this file is never started in CI. No workflow references it, and
# verify:no-ai fails if one did.
#
# Prefer the stdio transport (see mcp-client-allowlist.json). This compose file
# describes the HTTP variant, useful when several clients share one server, but it
# is the only variant exposed to CVE-2025-9611 (Origin header not validated,
# fixed in 0.0.40). Over stdio there is no socket to reach.
#
# Requires the SUT to be up: the sut-internal network is created by
# qa-automation/sut/docker/compose.yaml.

name: qa-ai-optional-mcp

services:
  playwright-mcp:
    image: mcr.microsoft.com/playwright/mcp:v0.0.80
    container_name: qa-ai-optional-mcp

    ports:
      - '127.0.0.1:8931:8931'

    command:
      - --headless
      - --isolated # no profile persisted between sessions
      - --port=8931
      - --host=0.0.0.0 # inside the container; exposure stays on 127.0.0.1
      # INBOUND protection against DNS rebinding (CVE-2025-9611). Not to be
      # confused with --allowed-origins, which is an OUTBOUND restriction that
      # upstream explicitly states is not a security boundary.
      - --allowed-hosts=localhost:8931,127.0.0.1:8931
      # Outbound restriction. Useful but not binding: it does not survive
      # redirects. The real barrier is the internal network below.
      - --allowed-origins=http://juice-shop:3000;http://localhost:3000
      - --blocked-origins=*
      # Barrier 3 of ADR-0002: a net, not a wall. Upstream calls this mechanism
      # "a convenience and not a security feature".
      - --secrets=/policy/secrets.env
      # Console messages are an exfiltration channel of their own.
      - --console-level=error
      - --output-dir=/output

    user: '1000:1000'
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
      - /output

    volumes:
      # Minimal, read-only mounts. tests/.auth/ and .env* are outside the mount:
      # a hijacked agent cannot read what it cannot see.
      - ../../qa-automation/tests:/workspace/tests:ro
      - ../../qa-automation/sut:/workspace/sut:ro
      - ./secrets.env:/policy/secrets.env:ro

    networks:
      - sut-internal

networks:
  sut-internal:
    # `internal: true`, declared in qa-automation/sut/docker/compose.yaml, removes the outbound
    # route: this container reaches juice-shop and NOTHING else. An ordinary
    # bridge would have let the whole internet through, and --allowed-origins
    # would not have prevented it.
    #
    # If you read one line of this file, read this one.
    name: qa-ai-optional-sut-internal
    external: true
